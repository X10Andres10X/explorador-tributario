<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Administrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
    <h2 class="text-2xl font-bold text-slate-800 mb-1">Acceso Administrador</h2>
    <p class="text-sm text-slate-500 mb-6">Ingresa tus credenciales para gestionar la base de datos</p>
    <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-sm p-3 rounded-lg mb-4"></div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
        <input type="text" id="username" required placeholder="admin" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>
      <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-semibold py-2.5 rounded-lg transition">Iniciar Sesión</button>
    </form>
    <div class="mt-6 text-center"><a href="index.html" class="text-xs text-indigo-600 hover:underline">&larr; Volver al buscador público</a></div>
  </div>
  <script>
    const API_URL = "/api";
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("errorBox");
      errorBox.classList.add("hidden");
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Error de autenticación");
        localStorage.setItem("admin_token", data.access_token);
        window.location.href = "admin.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
